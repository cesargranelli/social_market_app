name: social_market_app
description: "Social Market."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
# flutter depencies
  flutter:
    sdk: flutter
  flutter_confetti: ^0.5.1
  flutter_animation_progress_bar: ^2.3.1
  font_awesome_flutter: ^10.8.0
# google dependencies
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.2
  firebase_ui_auth: ^1.16.1
  firebase_ui_oauth_google: ^1.4.1
  firebase_storage: ^12.4.5
  firebase_app_check: ^0.3.2+5
  google_sign_in: ^6.3.0
  cloud_firestore: ^5.6.6
# image dependencies
  cached_network_image: ^3.4.1
# utils dependencies
  timeago: ^3.6.0
  uuid: ^4.5.1
  logging: ^1.3.0
# network dependencies
  http: ^1.3.0
  provider: ^6.1.4
  go_router: ^15.1.1
  path_provider: ^2.1.5
  path: ^1.9.1
# camera dependencies
  camera: ^0.11.1
  image_picker: ^1.1.2
  video_player: ^2.9.5
  mime: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/dash.png
    - assets/flutterfire_300x.png